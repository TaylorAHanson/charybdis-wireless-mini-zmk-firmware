## PMW3610 Driver (ALT)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

## USB Console Logging for diagnosis (viewable at https://zmk.dev/tools/log-viewer)
CONFIG_ZMK_USB_LOGGING=y